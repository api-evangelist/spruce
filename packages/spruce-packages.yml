generated: '2026-07-21'
method: searched
source: https://github.com/spruceid
description: >-
  First-party SpruceID open-source client libraries and SDKs, verified against the public
  package registries (crates.io via https://crates.io/api/v1/crates/*, npm via
  https://registry.npmjs.org) and the SpruceID GitHub organization
  (https://github.com/spruceid). SpruceID ships identity tooling as libraries rather than a
  hosted REST API: the Rust `ssi` stack (VCs/DIDs), the SpruceKit / SSX JavaScript/TypeScript
  SDKs, DIDKit WASM bindings, and the SpruceKit mobile wallet SDK. Registry front-ends return
  403 to automated clients; crate metadata confirmed via the crates.io JSON API.
packages:
  # --- Rust crates (crates.io) ---
  - language: rust
    registry: crates.io
    name: ssi
    url: https://crates.io/crates/ssi
    source: https://github.com/spruceid/ssi
    install: cargo add ssi
    version: 0.16.0
    official: true
    note: Core library for Verifiable Credentials and Decentralized Identifiers.
  - language: rust
    registry: crates.io
    name: isomdl
    url: https://crates.io/crates/isomdl
    source: https://github.com/spruceid/isomdl
    install: cargo add isomdl
    version: 0.2.0
    official: true
    note: ISO/IEC 18013-5 mobile driver's license (mDL) implementation in Rust.
  - language: rust
    registry: crates.io
    name: openid4vp
