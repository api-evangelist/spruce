aid: spruce
name: SpruceID
description: >-
  SpruceID is a digital trust infrastructure company building open-source software for
  digital identity — verifiable credentials, decentralized identifiers (DIDs), mobile
  driver's licenses (mDL, ISO/IEC 18013-5), and identity wallets. Its developer surface is
  a suite of open-source libraries and SDKs: the Rust `ssi` core library for Verifiable
  Credentials and DIDs, `isomdl` (ISO mDL), `openid4vp` (OpenID for Verifiable
  Presentations) and `oid4vci-rs` (OpenID for Verifiable Credential Issuance), plus the
  SpruceKit / SSX JavaScript & TypeScript SDKs and the SpruceKit mobile (Swift/Kotlin)
  wallet libraries. SpruceID works with government agencies to modernize identity,
  verification, and secure data exchange with privacy-preserving, standards-based
  architecture. Backed by a16z.
